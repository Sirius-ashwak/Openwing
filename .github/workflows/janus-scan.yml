name: Janus Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required for upload-sarif

env:
  PYTHON_DEFAULT: "3.13"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -v --tb=short

  scan:
    name: Janus Scan (offline)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install Janus
        run: pip install -e ".[dev]"

      - name: Run Janus offline scan
        run: |
          python -m janus run \
            --path examples/vulnerable_app/ \
            --format sarif \
            --output janus-results.sarif \
            --offline \
            --dry-run

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: janus-results.sarif
          category: janus-security

  scan-live:
    name: Janus Scan (live LLM)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && vars.JANUS_LIVE_SCAN == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install Janus
        run: pip install -e ".[dev]"

      - name: Run Janus with live LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
        run: |
          python -m janus run \
            --path examples/vulnerable_app/ \
            --format sarif \
            --output janus-results.sarif \
            --dry-run \
            --max-cycles 3

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: janus-results.sarif
          category: janus-security-live
