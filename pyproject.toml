[project]
name = "openwing-janus"
version = "0.1.0"
description = "Openwing Janus: Red/Blue multi-agent MVP for Flask SQLi remediation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]

[project.optional-dependencies]
examples = ["flask>=3.0.0"]
dev = ["pytest>=8.0.0"]
semgrep = ["semgrep>=1.50.0"]

[project.scripts]
janus = "janus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
